# VeriTruth — API + UI.
#
#     docker compose -f docker/docker-compose.yml up --build
#
# API  -> http://localhost:8000/docs
# UI   -> http://localhost:8501

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: veritruth:latest
    container_name: veritruth-api
    command: >
      sh -c "python -m src.rag.ingest_vectors &&
             uvicorn src.api.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_FACTCHECK_API_KEY: ${GOOGLE_FACTCHECK_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash}
      AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-30}
      AGENT_MAX_TOOL_CALLS: ${AGENT_MAX_TOOL_CALLS:-6}
      AGENT_USE_MCP: ${AGENT_USE_MCP:-0}
      EXPLAINER_BACKEND: ${EXPLAINER_BACKEND:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - veritruth-models:/app/models
      - veritruth-vectordb:/app/vectordb
      - veritruth-data:/app/data
      - veritruth-hf:/home/veritruth/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5
    restart: unless-stopped

  ui:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: veritruth:latest
    container_name: veritruth-ui
    command: >
      streamlit run app/streamlit_app.py
      --server.port 8501 --server.address 0.0.0.0 --server.headless true
    ports:
      - "8501:8501"
    environment:
      VERITRUTH_API_URL: http://api:8000
      VERITRUTH_UI_TIMEOUT: ${VERITRUTH_UI_TIMEOUT:-90}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  veritruth-models:
  veritruth-vectordb:
  veritruth-data:
  veritruth-hf:
