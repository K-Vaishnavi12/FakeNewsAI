# Forces VeriTruth to always render in light mode, regardless of the
# viewer's OS dark-mode setting. Without this, Streamlit inherits the OS
# theme and the light verdict cards clash with a dark page background.

[theme]
base = "light"
primaryColor = "#4f46e5"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f7fb"
textColor = "#0f172a"
font = "sans serif"

[client]
toolbarMode = "minimal"
showErrorDetails = true

[server]
headless = true

[browser]
gatherUsageStats = false
