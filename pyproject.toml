[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [".venv", "notebooks", "data", "models", "vectordb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = [
    "E501",  # long lines are already bounded by the formatter-friendly limit above
    "B008",  # FastAPI dependency defaults are idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"src/mcp_servers/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]
