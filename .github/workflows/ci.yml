name: CI

on:
  push:
    branches: [main, master, veritruth]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The project lives in the veritruth/ subfolder; the workflow itself must
# stay at the repository root for GitHub to discover it.
defaults:
  run:
    working-directory: veritruth

env:
  # Fully offline, deterministic test run: no LLM, no MCP subprocesses,
  # no external fact-check API.
  AGENT_USE_MCP: "0"
  EXPLAINER_BACKEND: occlusion
  LOG_LEVEL: WARNING
  PYTHONIOENCODING: utf-8

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff==0.6.5

      - name: Lint
        run: ruff check .

  test:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          # Resolved from the repo root: `uses` steps ignore working-directory.
          cache-dependency-path: veritruth/requirements.txt

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('veritruth/requirements.txt') }}

      - name: Install CPU-only torch
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch==2.4.1

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build dataset splits (synthetic fallback when no raw data)
        run: python -m src.data.split

      - name: Train baseline classifier
        run: python -m src.models.baseline

      - name: Calibrate trust scores
        run: python -m src.models.calibrate

      - name: Seed the vector store
        run: python -m src.rag.ingest_vectors

      - name: Run tests
        run: pytest -q
